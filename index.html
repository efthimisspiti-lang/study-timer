<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide timer</title>
<style>
:root{--w:#6f8dff;--w2:#4a3fd6;--glow:111,141,255}
[data-mode=short]{--w:#3fe0b8;--w2:#1a8fb0;--glow:63,224,184}
[data-mode=long]{--w:#ff93b8;--w2:#a35cf0;--glow:255,147,184}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.card{max-width:340px;margin:12px auto;padding:22px 20px 18px;border-radius:32px;color:#f3f5ff;display:grid;gap:22px;justify-items:center;
  background:radial-gradient(120% 70% at 50% 0%,rgba(var(--glow),.24),transparent 62%),#0b0f22;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 28px 60px -24px rgba(var(--glow),.55)}
.modes{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.06)}
.modes button{font-size:13px;padding:7px 14px;border-radius:999px;color:rgba(243,245,255,.55);transition:background .25s,color .25s}
.modes button[aria-pressed=true]{background:rgba(255,255,255,.14);color:#fff}
.orb{position:relative;width:250px;height:250px;border-radius:50%;overflow:hidden;isolation:isolate;background:rgba(255,255,255,.04);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 -34px 60px rgba(0,0,0,.28),0 0 56px rgba(var(--glow),.28)}
.orb::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:50%;
  background:radial-gradient(60% 40% at 30% 14%,rgba(255,255,255,.22),transparent 70%)}
.water{position:absolute;inset:0;transform:translateY(calc((1 - var(--p,0)) * (100% + 20px)));transition:transform .5s linear}
.body{position:absolute;inset:0;background:linear-gradient(var(--w),var(--w2))}
.wave{position:absolute;left:0;top:-16px;width:200%;height:16px;animation:slide 6s linear infinite}
.wave.b{top:-21px;opacity:.45;animation-duration:9s;animation-direction:reverse}
.wave path{fill:var(--w)}
@keyframes slide{to{transform:translateX(-50%)}}
.read{position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center}
#time{font-size:64px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(0,0,0,.35)}
#status{margin-top:10px;font-size:13px;color:rgba(255,255,255,.78);text-shadow:0 1px 10px rgba(0,0,0,.4)}
.orb.done{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 -34px 60px rgba(0,0,0,.28),0 0 100px rgba(var(--glow),.75)}}
.row{display:flex;align-items:center;gap:18px}
.step{width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;background:rgba(255,255,255,.07);color:rgba(243,245,255,.8);transition:background .2s}
.step:hover:not(:disabled){background:rgba(255,255,255,.14)}
.step:disabled{opacity:.3;cursor:default}
#go{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#f3f5ff;color:#0b0f22;box-shadow:0 0 34px rgba(var(--glow),.55);transition:transform .15s}
#go:active{transform:scale(.94)}
#go svg{width:26px;height:26px;fill:currentColor}
.foot{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:rgba(243,245,255,.55)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.14);transition:background .3s}
.dots i.on{background:rgb(var(--glow));box-shadow:0 0 10px rgba(var(--glow),.8)}
.dots span{margin-left:6px}
#reset:hover{color:#fff}
button:focus-visible{outline:2px solid rgb(var(--glow));outline-offset:3px}
@media (prefers-reduced-motion:reduce){.wave,.orb.done{animation:none}.water{transition:none}}
</style>
</head>
<body>
<main class="card" data-mode="focus" id="card">
  <div class="modes" role="group" aria-label="Timer mode">
    <button data-mode="focus" data-min="25" aria-pressed="true">Focus</button>
    <button data-mode="short" data-min="5" aria-pressed="false">Short break</button>
    <button data-mode="long" data-min="15" aria-pressed="false">Long break</button>
  </div>
  <div class="orb" id="orb">
    <div class="water" id="water">
      <div class="body"></div>
      <svg class="wave b" viewBox="0 0 400 16" preserveAspectRatio="none"><path d="M0 8 Q50 0 100 8 T200 8 T300 8 T400 8 V16 H0Z"/></svg>
      <svg class="wave" viewBox="0 0 400 16" preserveAspectRatio="none"><path d="M0 8 Q50 0 100 8 T200 8 T300 8 T400 8 V16 H0Z"/></svg>
    </div>
    <div class="read" role="timer"><div id="time">25:00</div><div id="status">Ready to focus</div></div>
  </div>
  <div class="row">
    <button class="step" id="minus" aria-label="Remove one minute">&minus;</button>
    <button id="go" aria-label="Start"></button>
    <button class="step" id="plus" aria-label="Add one minute">+</button>
  </div>
  <div class="foot">
    <div class="dots" id="dots" title="Focus sessions completed"><i></i><i></i><i></i><i></i><span id="count">0 done</span></div>
    <button id="reset">Reset</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
let mode = 'focus', total = 1500, left = 1500, endAt = 0, timer = null, done = 0, ctx = null;

const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function render() {
  const running = !!timer;
  $('time').textContent = fmt(left);
  $('water').style.setProperty('--p', 1 - left / total);
  $('go').innerHTML = running ? PAUSE : PLAY;
  $('go').setAttribute('aria-label', running ? 'Pause' : 'Start');
  $('minus').disabled = $('plus').disabled = running;
  $('status').textContent = left === 0 ? (mode === 'focus' ? 'Nice work. Take a break' : 'Break over')
    : running ? (mode === 'focus' ? 'Focusing' : 'On a break')
    : left < total ? 'Paused' : (mode === 'focus' ? 'Ready to focus' : 'Ready to rest');
  const n = done === 0 ? 0 : ((done - 1) % 4) + 1;
  [...$('dots').children].slice(0, 4).forEach((d, i) => d.classList.toggle('on', i < n));
  $('count').textContent = done + ' done';
  document.title = (running ? fmt(left) + ' · ' : '') + 'Tide timer';
}

function chime() {
  try {
    [523, 659, 784].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * .28;
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.18, t + .03);
      g.gain.exponentialRampToValueAtTime(.0001, t + .9);
      o.start(t); o.stop(t + .95);
    });
  } catch (e) {}
}

function stop() { clearInterval(timer); timer = null; }

function tick() {
  left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
  if (left === 0) { stop(); chime(); if (mode === 'focus') done++; $('orb').classList.add('done'); }
  render();
}

function start() {
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (left <= 0) left = total;
  $('orb').classList.remove('done');
  endAt = Date.now() + left * 1000;
  timer = setInterval(tick, 250);
  render();
}

function setMinutes(m) {
  stop();
  $('orb').classList.remove('done');
  total = left = Math.min(180, Math.max(1, m)) * 60;
  render();
}

$('go').onclick = () => timer ? (stop(), render()) : start();
$('reset').onclick = () => setMinutes(total / 60);
$('minus').onclick = () => setMinutes(total / 60 - 1);
$('plus').onclick = () => setMinutes(total / 60 + 1);

document.querySelectorAll('.modes button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', x === b));
    mode = b.dataset.mode;
    $('card').dataset.mode = mode;
    setMinutes(+b.dataset.min);
  };
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/BUTTON/.test(e.target.tagName)) { e.preventDefault(); $('go').click(); }
});

render();
</script>
</body>
</html>
